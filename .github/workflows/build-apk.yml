name: Build signed Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble signed release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify and upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: zi-normal-helth-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Keep a directly downloadable copy on the session branch as the requested
      # deliverable. It is signed with the persistent keystore in this project.
      - name: Publish signed APK on the branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ZI-Normal-Helth-release.apk
          git rm -f Normal-Helth-debug.apk || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ZI-Normal-Helth-release.apk
          git commit -m "build: publish signed release APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
